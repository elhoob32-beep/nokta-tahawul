<style>
/* Layout: عمود واحد للموبايل، شاشة واحدة كل مرة، شريط تنقل سفلي. الأخضر هو اللون الأساسي والذهبي نقطة صغيرة بس. */
:root{
  --bg:#f6f4ee; --surface:#ffffff; --fg:#11291f; --muted:#5b6a61; --line:#e0dccf;
  --green:#0f5c43; --green-ink:#ffffff; --gold:#d9a526; --soft:#e4eee7;
  --font:'IBM Plex Sans Arabic',Tahoma,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1a14; --surface:#14261d; --fg:#eaf1ec; --muted:#9db0a5; --line:#243a2f;
    --green:#3dae84; --green-ink:#06150e; --gold:#e3b447; --soft:#183226; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1a14; --surface:#14261d; --fg:#eaf1ec; --muted:#9db0a5; --line:#243a2f;
  --green:#3dae84; --green-ink:#06150e; --gold:#e3b447; --soft:#183226; color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--fg); font-family:var(--font); font-size:16px; line-height:1.7; direction:rtl;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:520px; margin-inline:auto; padding-block:16px 40px; min-width:0}
body.has-nav .wrap{padding-bottom:104px}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance}

.top{display:flex; align-items:center; justify-content:space-between; gap:12px; padding-bottom:24px}
.brand{display:flex; align-items:center; gap:12px}
.mark{width:40px; height:40px; border-radius:12px; background:var(--green); display:grid; place-items:center; flex:none}
.mark i{width:12px; height:12px; border-radius:50%; background:var(--gold); display:block}
.brand b{display:block; font-size:1.25rem; line-height:1.2}

.chip{display:inline-flex; align-items:center; gap:6px; border-radius:999px; padding:2px 12px; font-size:.85rem; background:var(--soft); color:var(--green); font-weight:500; white-space:nowrap}

.btn{display:inline-flex; align-items:center; justify-content:center; gap:10px; min-height:52px; padding:0 28px; border-radius:999px; border:0; font:inherit; font-weight:700; cursor:pointer; background:var(--green); color:var(--green-ink)}
.btn.ghost{background:var(--surface); color:var(--fg); border:1px solid var(--line)}
.btn.invert{background:var(--green-ink); color:var(--green)}
.btn.block{width:100%}
.btn[disabled]{opacity:.4; cursor:not-allowed}
.link{background:none; border:0; padding:6px 0; font:inherit; color:var(--muted); cursor:pointer; text-decoration:underline; text-underline-offset:4px}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--gold); outline-offset:2px}
@media (prefers-reduced-motion: no-preference){.btn,.opt,.tab{transition:background-color .15s,border-color .15s,opacity .15s}}

.dayline{display:flex; justify-content:space-between; font-size:.9rem; color:var(--muted); margin-bottom:10px}

textarea{display:block; width:100%; min-height:60px; border-radius:14px; border:1px solid var(--line); background:var(--bg); color:var(--fg); font:inherit; padding:12px; resize:vertical}

.list{margin:8px 0 0; padding:0; list-style:none}

.item .body{min-width:0; flex:1}
.item b{display:block; line-height:1.5}

.item.is-later b{color:var(--muted); font-weight:500}
.plan-h{font-size:1.6rem; line-height:1.35; margin-bottom:4px}
.summary-n{display:flex; gap:12px; margin:20px 0}
.summary-n div{flex:1; background:var(--soft); border-radius:16px; padding:14px; text-align:center}
.summary-n b{display:block; font-size:1.6rem; color:var(--green); line-height:1.3}
.summary-n span{font-size:.85rem; color:var(--muted)}
.note{margin-top:32px; font-size:.82rem; color:var(--muted)}
.share{margin-top:24px}
.share h3{font-size:1.1rem; margin-bottom:2px}
.linkbox{display:block; width:100%; margin-top:12px; padding:10px 12px; border-radius:12px; border:1px solid var(--line); background:var(--bg); color:var(--fg); font:inherit; font-size:.82rem}

.nav{position:fixed; inset-inline:0; bottom:0; z-index:5; background:var(--surface); border-top:1px solid var(--line);
  padding:8px max(16px,env(safe-area-inset-left,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px)); display:flex; justify-content:center}
.nav[hidden]{display:none}
.nav-in{display:flex; gap:8px; width:100%; max-width:520px}
.tab{flex:1; min-height:48px; border-radius:14px; border:0; background:transparent; color:var(--muted); font:inherit; font-weight:500; cursor:pointer}
.tab[aria-current="page"]{background:var(--soft); color:var(--green); font-weight:700}
</style>

];
var TIMES = [5,10,20,30];

/* ---------- أدوات ---------- */
function N(n){ return Number(n).toLocaleString('ar-EG'); }
function label(m){ return m <= 10 ? N(m) + ' دقايق' : N(m) + ' دقيقة'; }
function esc(s){ return String(s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function pad(n){ return String(n).padStart(2,'0'); }
function dayStr(d){ d = d || new Date(); return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
function yesterdayStr(){ var d = new Date(); d.setDate(d.getDate()-1); return dayStr(d); }
function stepOf(i){
  var s = AREAS[state.area].steps[i];
  var m = Math.max(3, Math.min(s.m, state.mins));
  var lb = label(m);
  return { t: s.t.replace('{m}', lb), d: s.d.replace('{m}', lb), m: m, lb: lb };

function streak(){
  var days = {}; (state.days || []).forEach(function(x){ days[x] = 1; });

  var n = 0; while(days[dayStr(d)]){ n++; d.setDate(d.getDate()-1); }
  return n;

/* ---------- الحفظ (على الجهاز ده بس) ---------- */
var KEY = 'noktat-tahawul-v1', mem = null;

  try { var r = localStorage.getItem(KEY); var s = r ? JSON.parse(r) : null; return valid(s) ? s : null; }

}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){ mem = state; } }
function clearSaved(){ try { localStorage.removeItem(KEY); } catch(e){} mem = null; }

var state = load();
var ui = { screen: state ? 'today' : 'welcome', q: 0, draft: {}, fresh: false, confirm: false, feel: null, noteDraft: '', prevDays: [] };

var QUIZ = [
  { key:'area', t:'عايز تغيّر إيه؟', s:'ابدأ بمجال واحد بس. مش لازم تغيّر حياتك كلها مرة واحدة.',
    opts: Object.keys(AREAS).map(function(id){ return { id:id, l:AREAS[id].name, d:AREAS[id].desc }; }) },
  { key:'mins', t:'معاك كام دقيقة في اليوم؟', s:'هنظبط كل خطوة على وقتك.',
    opts: TIMES.map(function(m){ return { id:m, l:label(m), d:'' }; }) },
  { key:'blocker', t:'إيه أكتر حاجة بتوقفك؟', s:'اختار الأقرب ليك.',
    opts: BLOCKERS.map(function(b){ return { id:b.id, l:b.l, d:'' }; }) }
];

/* ---------- الشاشات ---------- */
function header(){
  var s = state ? streak() : 0;
  return '<div class="top"><div class="brand"><div class="mark"><i></i></div><div><b>نقطة تحول</b><small>NOKTAT TAHAWUL</small></div></div>' +
    (s > 0 ? '<span class="chip">' + N(s) + (s === 1 ? ' يوم' : s <= 10 ? ' أيام متتالية' : ' يوم متتالي') + '</span>' : '') + '</div>';
}

function welcome(){
  return '<div class="appbar">' +
    '<button class="mini-btn" data-act="lang" aria-label="تغيير اللغة">EN</button>' +
    '<div class="account-actions"><button class="mini-btn" data-act="login">دخول</button><button class="mini-btn primary-mini" data-act="signup">إنشاء حساب</button></div>' +
    '</div>' +
    '<div class="welcome-brand"><div class="mark big-mark"><i></i></div><div><b>نقطة تحول</b><small>NOKTAT TAHAWUL</small></div></div>' +
    '<span class="pill"><i></i>مش تطبيق تحفيز. تطبيق خطوات.</span>' +
    '<h1 class="hero">كل تغيير كبير يبدأ بنقطة واحدة</h1>' +
    '<p class="lead">مش محتاج نصيحة جديدة... محتاج تعرف تبدأ منين. المساعد يفهم وضعك، ويحوّل هدفك لأول خطوة تقدر تنفذها.</p>' +
    '<div class="cta"><button class="btn block" data-act="start">ابدأ نقطة التحول ←</button>' +
    '<p class="fine">مجاني · مساعد شخصي · أول خطوة واضحة</p></div>' +
    '<div class="assistant-card">' +
      '<div class="assistant-head"><div class="assistant-avatar">✦</div><div><b>مساعد نقطة تحول</b><span>هساعدك تحدد البداية، مش هديك كلام عام.</span></div></div>' +
      '<h3>المساعد يقدر يساعدك في إيه؟</h3>' +
      '<div class="assistant-grid">' +
        '<button class="assistant-opt" data-act="assistant" data-val="work"><b>💼 الشغل والمهنة</b><span>وظيفة، تغيير مسار، مهارة</span></button>' +
        '<button class="assistant-opt" data-act="assistant" data-val="money"><b>💰 المال والدخل</b><span>ترتيب وضعك وأول خطوة</span></button>' +
        '<button class="assistant-opt" data-act="assistant" data-val="learn"><b>📚 التعلم والتطوير</b><span>اختيار مهارة والبدء فيها</span></button>' +
        '<button class="assistant-opt" data-act="assistant" data-val="calm"><b>🧠 الهدوء والتشتت</b><span>تقليل التشتت وترتيب اليوم</span></button>' +
        '<button class="assistant-opt" data-act="assistant" data-val="relationships"><b>❤️ العلاقات</b><span>تواصل وحدود أوضح</span></button>' +
        '<button class="assistant-opt" data-act="assistant" data-val="goal"><b>🎯 هدف مش عارف تبدأه</b><span>نحوّل الهدف لأول خطوة</span></button>' +
      '</div>' +
      '<button class="assistant-free" data-act="assistant" data-val="other">❓ مش عارف أبدأ منين</button>' +
    '</div>' +
    '<div class="card example"><div class="eyebrow"><span>مثال لخطوة النهاردة</span><span>١ من ٧ خطوات</span></div>' +
    '<h3>اكتب ٣ حاجات مضايقاك في يومك، وجنب كل واحدة أول حل ممكن</h3>' +
    '<div class="tags"><span class="tag">٥ دقايق</span><span class="tag">الهدوء النفسي</span></div></div>' +
    '<div class="how"><h2>من حيرة كبيرة لخطوة واحدة واضحة</h2><ol>' +
    '<li><span class="num">١</span><div><b>قولنا إنت فين دلوقتي</b><span>٣ أسئلة قصيرة عن المجال ووقتك وإيه اللي بيوقفك.</span></div></li>' +
    '<li><span class="num">٢</span><div><b>المساعد يحدد معاك البداية</b><span>مش نصيحة عامة؛ خطوة مناسبة لوضعك ووقتك.</span></div></li>' +
    '<li><span class="num">٣</span><div><b>تنفذ وتتابع تقدمك</b><span>تعلّم إن الخطوة تمت، وتكمل من النقطة اللي وصلت لها.</span></div></li>' +
    '</ol></div>';
}

function quiz(){
  var q = QUIZ[ui.q], cur = ui.draft[q.key];
  var segs = '';
  for(var i = 0; i < 3; i++) segs += '<span class="' + (i < ui.q ? 'd' : i === ui.q ? 'c' : '') + '"></span>';
  var opts = q.opts.map(function(o){
    return '<button class="opt" data-act="pick" data-val="' + esc(o.id) + '" aria-pressed="' + (String(cur) === String(o.id)) + '"><b>' + esc(o.l) + '</b>' + (o.d ? '<span>' + esc(o.d) + '</span>' : '') + '</button>';
  }).join('');
  return '<div class="qhead"><button class="link" data-act="qback">رجوع</button><span>سؤال ' + N(ui.q+1) + ' من ' + N(3) + '</span></div>' +
    '<div class="segs">' + segs + '</div>' +
    '<h2 class="q">' + q.t + '</h2><p class="lead">' + q.s + '</p>' +
    '<div class="opts">' + opts + '</div>' +
    '<button class="btn block" data-act="qnext"' + (cur === undefined ? ' disabled' : '') + '>' + (ui.q < 2 ? 'التالي ←' : 'اعمل خطتي') + '</button>';
}

function segsHTML(done, now){
  var h = '';
  for(var i = 0; i < 7; i++) h += '<span class="' + (i < done ? 'd' : i === now ? 'c' : '') + '"></span>';
  return '<div class="segs">' + h + '</div>';
}

function planView(){
  var done = state.steps.filter(function(s){ return s.done; }).length;
  var blocker = BLOCKERS.filter(function(b){ return b.id === state.blocker; })[0];
  var items = state.steps.map(function(st, i){
    var s = stepOf(i);
    var cls = st.done ? 'is-done' : i === done ? 'is-now' : 'is-later';
    var show = st.done || i === done;
    var extra = '';
    if(st.done && st.feel) extra += '<small>حسيت: ' + esc(st.feel) + '</small>';
    return '<li class="item ' + cls + '"><span class="idx">' + (st.done ? '✓' : N(i+1)) + '</span><div class="body"><b>' + esc(s.t) + '</b>' +
      (show ? '<small>' + esc(s.d) + '</small>' : '') + '<small>' + esc(s.lb) + '</small>' + extra + '</div></li>';
  }).join('');
  var foot;
  if(ui.fresh){
    foot = '<div class="cta"><button class="btn block" data-act="begin">ابدأ أول خطوة ←</button></div>';
  } else if(ui.confirm){
    foot = '<div class="soft">هتبدأ خطة جديدة، والخطة الحالية هتتمسح. متأكد؟</div><div class="row"><button class="btn ghost" data-act="resetno">لا، كمّل</button><button class="btn" data-act="resetyes">آه، ابدأ خطة جديدة</button></div>';
  } else {
    foot = '<div class="row"><button class="link" data-act="reset">ابدأ خطة جديدة</button></div>';
  }
  return (ui.fresh ? '<span class="chip">خطتك جاهزة</span>' : '') +
    '<h2 class="plan-h" style="margin-top:12px">' + esc(AREAS[state.area].name) + '</h2>' +
    '<p class="lead">٧ خطوات · لحد ' + label(state.mins) + ' في اليوم</p>' +
    (blocker ? '<div class="soft">' + esc(blocker.l) + '؟ ' + esc(blocker.tip) + '</div>' : '') +
    '<div class="card" style="margin-top:16px"><ul class="list">' + items + '</ul></div>' + foot + (ui.fresh ? '' : shareCard());
}

function reflection(idx){
  var feels = FEELS.map(function(f){ return '<button class="opt" data-act="feel" data-val="' + f + '" aria-pressed="' + (ui.feel === f) + '">' + f + '</button>'; }).join('');
  return '<div class="card done-card" style="margin-top:16px"><h3>حسيت بإيه بعد الخطوة؟</h3><p class="fine">اختياري، بس بيساعدك تشوف تقدمك بعدين.</p>' +
    '<div class="feels">' + feels + '</div>' +
    '<textarea id="note" maxlength="500" placeholder="ملاحظة قصيرة لنفسك (اختياري)">' + esc(ui.noteDraft) + '</textarea>' +
    '<div class="row"><button class="btn" data-act="saveref">احفظ</button><button class="link" data-act="skipref">تخطي</button></div></div>';
}

function todayView(){
  var done = state.steps.filter(function(s){ return s.done; }).length;
  var last = done > 0 ? state.steps[done-1] : null;
  if(done === 7){
    if(!last.reflected) return '<h2 class="plan-h">خلصت آخر خطوة</h2><p class="lead">قبل الملخص، قولنا حسيت بإيه.</p>' + reflection(6);
    return summary();
  }
  var lockedToday = last && last.doneDay === dayStr() && state.unlockIdx !== done;
  if(lockedToday){
    var s = stepOf(done-1);
    var saved = '';
    if(last.reflected){
      saved = '<div class="saved">' + (last.feel ? 'حسيت: ' + esc(last.feel) : 'من غير تقييم') + (last.note ? '<br>' + esc(last.note) : '') + '</div>';
    }
    return '<div class="dayline"><span>خلصت ' + N(done) + ' من ٧</span></div>' + segsHTML(done, -1) +
      '<div class="card done-card"><div class="eyebrow"><span>خطوة النهاردة تمت</span></div><h3>' + esc(s.t) + '</h3><p class="fine">الخطوة الجاية (' + N(done+1) + ') بتفتح بكرة. ارتاح النهاردة.</p>' + saved + '</div>' +
      (last.reflected ? '' : reflection(done-1)) +
      '<div class="row" style="margin-top:16px"><button class="link" data-act="unlock">عايز أكمل النهاردة، افتح الخطوة الجاية</button></div>';
  }
  var s2 = stepOf(done);
  var blocker = BLOCKERS.filter(function(b){ return b.id === state.blocker; })[0];
  var missed = last && last.doneDay < yesterdayStr();
  return '<div class="dayline"><span>الخطوة ' + N(done+1) + ' من ' + N(7) + '</span><span>' + esc(AREAS[state.area].name) + '</span></div>' + segsHTML(done, done) +
    '<div class="stepcard"><div class="meta"><span>' + esc(s2.lb) + '</span></div><h2>' + esc(s2.t) + '</h2><p>' + esc(s2.d) + '</p>' +
    '<button class="btn invert block" data-act="done">نفذت الخطوة</button></div>' +
    (missed ? '<div class="soft">فاتك كام يوم؟ عادي. كمّل من نفس الخطوة.</div>' : '') +
    (blocker ? '<p class="tip">' + esc(blocker.tip) + '</p>' : '');
}

function summary(){
  var items = state.steps.map(function(st, i){
    var s = stepOf(i);
    return '<li class="item is-done"><span class="idx">✓</span><div class="body"><b>' + esc(s.t) + '</b>' +
      (st.feel ? '<small>حسيت: ' + esc(st.feel) + '</small>' : '') + (st.note ? '<small>' + esc(st.note) + '</small>' : '') + '</div></li>';
  }).join('');
  var uniq = {}; state.steps.forEach(function(s){ if(s.doneDay) uniq[s.doneDay] = 1; });
  return '<span class="chip">الخطة اكتملت</span><h2 class="plan-h" style="margin-top:12px">خلصت الـ٧ خطوات</h2>' +
    '<p class="lead">بدأت من نقطة واحدة في ' + esc(AREAS[state.area].name) + '، وبقى عندك ٧ خطوات اتنفذت فعلًا.</p>' +
    '<div class="summary-n"><div><b>' + N(7) + '</b><span>خطوات</span></div><div><b>' + N(Object.keys(uniq).length) + '</b><span>أيام نشاط</span></div></div>' +
    '<div class="card"><ul class="list">' + items + '</ul></div>' +
    shareCard() +
    '<div class="cta"><button class="btn block" data-act="newplan">ابدأ نقطة تحول جديدة ←</button></div>';
}

var SHARE_URL = 'https://claude.ai/artifact/CDvQdQyYfnt7KuFQkdRciw';
var SHARE_MSG = 'جرّبت تطبيق نقطة تحول: بيديك خطة ٧ خطوات صغيرة وتنفذ خطوة كل يوم.\n';
function shareCard(){
  return '<div class="card share"><h3>شارك نقطة تحول مع حد بتحبه</h3><p class="fine">كل واحد بيبدأ خطته الخاصة، وتقدمه بيتحفظ عنده هو.</p>' +
    '<input id="sharelink" class="linkbox" readonly dir="ltr" value="' + esc(SHARE_URL) + '" aria-label="رابط التطبيق">' +
    '<div class="row"><button class="btn" data-act="copy">' + (ui.copied ? 'تم النسخ ✓' : 'انسخ رسالة المشاركة') + '</button></div></div>';
}

var NOTE = '<p class="note">نقطة تحول بتساعدك تبدأ بخطوات عملية بسيطة، وهي مش بديل عن متخصص. لو تعبان نفسيًا فعلًا، كلّم متخصص أو حد قريب منك.</p>';

function render(){
  var app = document.getElementById('app'), nav = document.getElementById('nav');
  var inApp = !!state && (ui.screen === 'today' || ui.screen === 'plan');
  document.body.classList.toggle('has-nav', inApp);
  var body = '';
  if(ui.screen === 'welcome') body = welcome();
  else if(ui.screen === 'quiz') body = quiz();
  else if(ui.screen === 'plan') body = planView();
  else body = todayView();
  app.innerHTML = header() + body + NOTE;
  nav.hidden = !inApp;
  nav.innerHTML = inApp ? '<div class="nav-in"><button class="tab" data-act="tab" data-val="today"' + (ui.screen === 'today' ? ' aria-current="page"' : '') + '>اليوم</button>' +
    '<button class="tab" data-act="tab" data-val="plan"' + (ui.screen === 'plan' ? ' aria-current="page"' : '') + '>خطتي</button></div>' : '';
}
function go(screen){ ui.screen = screen; render(); try { window.scrollTo(0,0); } catch(e){} }

function startNewPlan(){
  ui.prevDays = state ? (state.days || []) : [];
  state = null; clearSaved();
  ui.draft = {}; ui.q = 0; ui.confirm = false; ui.fresh = false;
  go('quiz');
}
function readNote(){ var ta = document.getElementById('note'); if(ta) ui.noteDraft = ta.value; }
function finishReflection(withValues){
  var done = state.steps.filter(function(s){ return s.done; }).length;
  var st = state.steps[done-1];
  if(withValues){ readNote(); st.feel = ui.feel || null; st.note = (ui.noteDraft || '').trim().slice(0,500); }
  st.reflected = true; ui.feel = null; ui.noteDraft = '';
  save(); render();
}

function act(a, val){
  if(a === 'lang'){
    alert('اللغة الحالية: العربية\nسنضيف تبديل العربية / English في الخطوة التالية.');
  }
  else if(a === 'login'){
    alert('تسجيل الدخول سيتم ربطه بـ Firebase Authentication.');
  }
  else if(a === 'signup'){
    alert('إنشاء الحساب سيتم ربطه بـ Firebase Authentication.');
  }
  else if(a === 'assistant'){
    if(val === 'work') ui.draft = {area:'work'};
    else if(val === 'money') ui.draft = {area:'money'};
    else if(val === 'relationships') ui.draft = {area:'relationships'};
    else if(val === 'calm') ui.draft = {area:'calm'};
    else ui.draft = {};
    ui.q = 0; go('quiz');
  }
  else if(a === 'start'){ ui.draft = {}; ui.q = 0; go('quiz'); }
  else if(a === 'pick'){ var key = QUIZ[ui.q].key; ui.draft[key] = key === 'mins' ? parseInt(val,10) : val; render(); }
  else if(a === 'qback'){ if(ui.q > 0){ ui.q--; render(); } else go('welcome'); }
  else if(a === 'qnext'){
    if(ui.q < 2){ ui.q++; render(); return; }
    state = { area: ui.draft.area, mins: ui.draft.mins, blocker: ui.draft.blocker, days: ui.prevDays || [], unlockIdx: -1,
      steps: [{},{},{},{},{},{},{}] };
    save(); ui.fresh = true; go('plan');
  }
  else if(a === 'begin'){ ui.fresh = false; go('today'); }
  else if(a === 'tab'){ ui.confirm = false; go(val); }
  else if(a === 'done'){
    var i = state.steps.filter(function(s){ return s.done; }).length;
    var d = dayStr();
    state.steps[i] = { done: true, doneDay: d };
    state.days = state.days || [];
    if(state.days.indexOf(d) < 0) state.days.push(d);
    ui.feel = null; ui.noteDraft = '';
    save(); render(); try { window.scrollTo(0,0); } catch(e){}
  }
  else if(a === 'feel'){ readNote(); ui.feel = (ui.feel === val ? null : val); render(); }
  else if(a === 'saveref'){ finishReflection(true); }
  else if(a === 'skipref'){ finishReflection(false); }
  else if(a === 'unlock'){ state.unlockIdx = state.steps.filter(function(s){ return s.done; }).length; save(); render(); try { window.scrollTo(0,0); } catch(e){} }
  else if(a === 'reset'){ ui.confirm = true; render(); }
  else if(a === 'resetno'){ ui.confirm = false; render(); }
  else if(a === 'copy'){
    var txt = SHARE_MSG + SHARE_URL;
    var ok = function(){ ui.copied = true; render(); setTimeout(function(){ ui.copied = false; render(); }, 2500); };
    var fb = function(){ var i = document.getElementById('sharelink'); if(i){ i.focus(); i.select(); } };
    try { navigator.clipboard.writeText(txt).then(ok, fb); } catch(e){ fb(); }
  }
  else if(a === 'resetyes' || a === 'newplan'){ startNewPlan(); }
}

document.addEventListener('click', function(e){
  var b = e.target.closest ? e.target.closest('[data-act]') : null;
  if(!b || b.disabled) return;
  act(b.getAttribute('data-act'), b.getAttribute('data-val'));
});

window.__noktat = { act: act, render: render, getState: function(){ return state; } };
render();
})();
</script>

</body></html>
